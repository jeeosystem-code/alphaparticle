name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the project zip
        run: |
          mkdir -p /tmp/proj
          for z in ./*.zip; do unzip -q -o "$z" -d /tmp/proj; done
          SETTINGS=$(find /tmp/proj -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then echo "No Android project found inside the zip"; exit 1; fi
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
